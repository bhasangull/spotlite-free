[package]
name = "spotlite-free"
version = "0.4.0"
edition = "2021"
description = "Low-overhead Spotify Free web player launcher for Windows"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
