[package]
name = "spotlite"
version = "0.1.0"
edition = "2021"
description = "An independent native music player prototype"

[dependencies]
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }
